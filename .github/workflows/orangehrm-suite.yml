# Runs the suite against a private OrangeHRM, one fresh instance per run.
name: OrangeHRM suite

on:
    workflow_dispatch:
        inputs:
            ohrm_version:
                description: OrangeHRM image tag
                default: '5.9'
            ohrm_ref:
                description: Commit or tag of ohrm_repo to build from source, replacing the image tag
                default: ''
            ohrm_repo:
                description: Public https://github.com/<owner>/<repository> clone URL that ohrm_ref is built from; unused without ohrm_ref
                default: https://github.com/orangehrm/orangehrm.git
            runs:
                description: Number of independent runs, each on a fresh instance
                default: '1'
            debug_logs:
                description: Run OrangeHRM in debug mode, which changes its logging
                type: boolean
                default: false
            runner_prep:
                description: Encrypted script that infra/prepare-runner.sh starts in the background before the tests
                default: ''

jobs:
    plan:
        runs-on: ubuntu-latest
        outputs:
            matrix: ${{ steps.matrix.outputs.value }}
        steps:
            - id: matrix
              env:
                  RUNS: ${{ inputs.runs }}
              run: echo "value=$(seq 1 "$RUNS" | jq -cs .)" >> "$GITHUB_OUTPUT"

    suite:
        needs: plan
        name: Run ${{ matrix.run }}
        # Playwright 1.60 has no browser dependencies for Ubuntu 26.04.
        runs-on: ubuntu-24.04
        timeout-minutes: 45
        strategy:
            fail-fast: false
            matrix:
                run: ${{ fromJson(needs.plan.outputs.matrix) }}
        env:
            OHRM_VERSION: ${{ inputs.ohrm_version }}
            OHRM_DEBUG: ${{ inputs.debug_logs }}
            ADMIN_USERNAME: Admin
            APP_URL: http://localhost:8080
            API_URL: http://localhost:8080
            # Outside playwright-report/, which the HTML reporter clears when it writes.
            PLAYWRIGHT_JSON_OUTPUT_NAME: json-report/results.json

        steps:
            - uses: actions/checkout@v7

            - uses: actions/setup-node@v7
              with:
                  node-version-file: .nvmrc
                  cache: npm

            - name: Install dependencies
              run: npm ci

            # Some jobs get about 40 kB/s from the Ubuntu mirror for their whole run, so the
            # 21 MB of font packages takes about 10 minutes. The cache skips that download.
            - name: Restore apt packages
              id: apt-cache
              uses: actions/cache/restore@v6
              with:
                  path: ~/apt-archives
                  key: chromium-apt-ubuntu-24.04-${{ hashFiles('package-lock.json') }}

            - name: Load cached apt packages
              if: steps.apt-cache.outputs.cache-hit == 'true'
              run: sudo cp ~/apt-archives/*.deb /var/cache/apt/archives/

            # The limit leaves room for a slow download when the cache is empty.
            - name: Install Chromium
              timeout-minutes: 15
              run: npx playwright install --with-deps chromium

            - name: Collect apt packages
              if: steps.apt-cache.outputs.cache-hit != 'true'
              run: |
                  mkdir -p ~/apt-archives
                  find /var/cache/apt/archives -maxdepth 1 -name '*.deb' -exec cp -t ~/apt-archives {} +

            # Saved here, not at job end, because the suite's known failure would skip a later save.
            - name: Save apt packages
              if: steps.apt-cache.outputs.cache-hit != 'true'
              uses: actions/cache/save@v6
              with:
                  path: ~/apt-archives
                  key: ${{ steps.apt-cache.outputs.cache-primary-key }}

            # Generated per run: the instance lives only on this runner.
            - name: Generate throwaway credentials
              run: |
                  db_password="$(openssl rand -hex 16)"
                  admin_password="Ci-$(openssl rand -hex 12)-Aa1"
                  echo "::add-mask::$db_password"
                  echo "::add-mask::$admin_password"
                  echo "DB_ROOT_PASSWORD=$db_password" >> "$GITHUB_ENV"
                  echo "ADMIN_PASSWORD=$admin_password" >> "$GITHUB_ENV"

            - name: Build OrangeHRM from source
              if: ${{ inputs.ohrm_ref != '' }}
              env:
                  OHRM_REF: ${{ inputs.ohrm_ref }}
                  OHRM_REPO: ${{ inputs.ohrm_repo }}
              run: |
                  infra/build-orangehrm-from-ref.sh "$OHRM_REF" orangehrm-source:local "$OHRM_REPO"
                  echo "OHRM_IMAGE=orangehrm-source:local" >> "$GITHUB_ENV"
                  label() { docker image inspect --format "{{ index .Config.Labels \"org.opencontainers.image.$1\" }}" orangehrm-source:local; }
                  echo "OHRM_SOURCE_REPO=$(label source)" >> "$GITHUB_ENV"
                  echo "OHRM_SHA=$(label revision)" >> "$GITHUB_ENV"

            - name: Start OrangeHRM
              run: infra/start-orangehrm.sh

            # The run API does not expose dispatch inputs, so this file is the record of which app ran.
            # It runs after the start, so the app container's image is pulled and can be inspected.
            # A source build records its repository and commit; the image path records the tag
            # input and the pulled image's digest.
            - name: Record build info
              if: ${{ !cancelled() }}
              env:
                  REQUESTED_REPO: ${{ inputs.ohrm_ref != '' && inputs.ohrm_repo || '' }}
                  REQUESTED_REF: ${{ inputs.ohrm_ref }}
                  REQUESTED_VERSION: ${{ inputs.ohrm_ref == '' && inputs.ohrm_version || '' }}
              run: |
                  image=""
                  image_digest=""
                  container="$(docker compose -f infra/docker-compose.yml ps --all --quiet app 2>/dev/null || true)"
                  if [[ -n "$container" ]]; then
                      image="$(docker inspect --format '{{ .Config.Image }}' "$container")"
                      image_id="$(docker inspect --format '{{ .Image }}' "$container")"
                      image_digest="$(docker image inspect --format '{{ join .RepoDigests " " }}' "$image_id")"
                  fi
                  mkdir -p app-logs
                  jq -n \
                      --arg ohrm_repo "${OHRM_SOURCE_REPO:-$REQUESTED_REPO}" \
                      --arg ohrm_ref "$REQUESTED_REF" \
                      --arg ohrm_sha "${OHRM_SHA:-}" \
                      --arg ohrm_version "$REQUESTED_VERSION" \
                      --arg ohrm_image "$image" \
                      --arg ohrm_image_digest "$image_digest" \
                      --arg test_sha "$GITHUB_SHA" \
                      '$ARGS.named' > app-logs/build-info.json
                  cat app-logs/build-info.json

            - name: Prepare runner
              env:
                  RUNNER_PREP: ${{ inputs.runner_prep }}
                  RUNNER_PREP_KEY: ${{ secrets.RUNNER_PREP_KEY }}
              run: infra/prepare-runner.sh

            - name: Run Playwright tests
              run: npx playwright test --reporter=list,json,html

            - name: Collect application logs
              if: ${{ !cancelled() }}
              working-directory: infra
              run: |
                  if [[ -f "$RUNNER_TEMP/runner-prep.pgid" ]]; then
                      kill -- "-$(cat "$RUNNER_TEMP/runner-prep.pgid")" 2>/dev/null || true
                  fi
                  mkdir -p ../app-logs
                  docker compose logs --timestamps --no-color > ../app-logs/containers.log || true
                  docker compose cp app:/var/www/html/src/log ../app-logs/orangehrm || true

            - name: Upload evidence
              if: ${{ !cancelled() }}
              uses: actions/upload-artifact@v7
              with:
                  name: evidence-run-${{ matrix.run }}
                  path: |
                      json-report/
                      playwright-report/
                      test-results/
                      app-logs/
                  retention-days: 30
