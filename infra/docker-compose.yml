# A private, throwaway OrangeHRM for the test suite to run against.
services:
    db:
        image: mariadb:10.11
        environment:
            MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?DB_ROOT_PASSWORD is required}
        healthcheck:
            test: ['CMD', 'healthcheck.sh', '--connect', '--innodb_initialized']
            interval: 5s
            timeout: 5s
            retries: 30

    app:
        image: ${OHRM_IMAGE:-orangehrm/orangehrm:${OHRM_VERSION:-5.9}}
        depends_on:
            db:
                condition: service_healthy
        ports:
            - '${OHRM_PORT:-8080}:80'
